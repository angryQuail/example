<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 비율 맞추기 (터치 앱 필수 설정) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>터치 감지 테스트</title>
    <style>
        /* 터치하기 편하도록 중앙에 큰 사각형 배치 */
        #touchArea {
            width: 300px;
            height: 300px;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            margin: 50px auto;
            user-select: none; /* 텍스트 선택 방지 */
            transition: background-color 0.2s;
        }
    </style>
</head>
<body>

    <!-- 1. HTML: 터치를 감지할 영역 만들기 -->
    <div id="touchArea">여기를 터치하세요!</div>

    <!-- 2. JavaScript: 터치 이벤트 감지하고 처리하기 -->
    <script>
        const area = document.getElementById('touchArea');

        // 손가락이 화면에 닿았을 때
        area.addEventListener('touchstart', (e) => {
            area.style.backgroundColor = '#e74c3c'; // 빨간색으로 변경
            area.innerText = '터치 중입니다!';
        });

        // 손가락이 화면에서 떨어졌을 때
        area.addEventListener('touchend', () => {
            area.style.backgroundColor = '#3498db'; // 원래 파란색으로 복구
            area.innerText = '여기를 터치하세요!';
        });

        // 손가락을 대고 움직일 때 (선택 사항)
        area.addEventListener('touchmove', (e) => {
            // 터치된 좌표 실시간 좌표 출력
            let touch = e.touches[0];
            area.innerText = `이동 중! X: ${Math.round(touch.clientX)}, Y: ${Math.round(touch.clientY)}`;
        });
    </script>

</body>
</html>
